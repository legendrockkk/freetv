<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FreeTV — 8000+ Free Live TV Channels</title>
<meta name="description" content="Watch 8000+ free live TV channels from 200+ countries. News, sports, movies, music, kids and more — no signup, free forever.">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
</head>
<body>

<header>
  <div class="top">
    <div class="brand"><span class="tv">📺</span><span>Free<b>TV</b></span></div>
    <div class="search">
      <span>🔍</span>
      <input id="search" type="search" placeholder="Search channels… (e.g. news, sports)" autocomplete="off">
    </div>
    <button id="favToggle" class="iconbtn" title="Favorites">★ Fav</button>
    <button id="langToggle" class="iconbtn" title="भाषा / Language">🌐 हिं</button>
  </div>
</header>

<div class="filters">
  <div class="srow">
    <select id="country" aria-label="Country">
      <option value="all">🌍 All Countries</option>
    </select>
    <select id="language" aria-label="Language">
      <option value="all">🗣 All Languages</option>
    </select>
  </div>
  <div class="cats" id="cats"></div>
</div>

<main>
  <div id="count"></div>
  <div id="loading"><div class="spin"></div><div id="loadingText">Loading channels…</div></div>
  <div id="grid"></div>
  <div id="sentinel" style="height:1px"></div>
</main>

<div id="player" role="dialog" aria-modal="true">
  <div class="pbox">
    <div class="phead">
      <div class="t">
        <div id="pName"></div>
        <div id="pMeta"></div>
      </div>
      <button id="pClose" aria-label="Close">✕</button>
    </div>
    <div class="vwrap">
      <video id="video" controls playsinline></video>
    </div>
    <div id="pError"></div>
  </div>
</div>

<footer id="footer"></footer>

<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
