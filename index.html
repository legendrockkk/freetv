<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FreeTV — India ke Live TV Channels</title>
<meta name="description" content="India ke free live TV channels — Hindi, Marathi, English aur Sports. Bina signup, bilkul muft.">
<meta name="theme-color" content="#0d0f16">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand"><span class="tv">📺</span><span>Free<b>TV</b></span><span class="itag">India</span></div>
    <div class="hbtns">
      <button id="favToggle" class="iconbtn" title="Favorites">★</button>
      <button id="langToggle" class="iconbtn" title="भाषा / Language">🌐 हिं</button>
    </div>
  </div>
  <div class="sub" id="subLine"></div>
  <div class="search">
    <span>🔍</span>
    <input id="search" type="search" placeholder="Channel dhoondo…" autocomplete="off">
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="hindi" class="active">हिंदी</button>
  <button data-tab="marathi">मराठी</button>
  <button data-tab="english">English</button>
  <button data-tab="sports" id="tabSports">🏆 Sports</button>
</nav>

<div class="cats" id="cats"></div>

<main>
  <div id="count"></div>
  <div id="loading"><div class="spin"></div><div id="loadingText">Loading…</div></div>
  <div id="grid"></div>
  <div id="sentinel" style="height:1px"></div>
</main>

<div id="player" role="dialog" aria-modal="true" aria-label="Video player">
  <video id="video" controls playsinline></video>
  <div class="pbar" id="pbar">
    <button id="pClose" aria-label="Close">✕</button>
    <div class="ptitle">
      <div id="pName"></div>
      <div id="pMeta"></div>
    </div>
    <span class="plive"><i></i>LIVE</span>
  </div>
  <div id="pError"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
